<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arbitrage Pro | Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #5865F2;
            --accent-glow: rgba(88, 101, 242, 0.2);
            --bg: #1a1a1c;
            --bg-elevated: #111113;
            --card-glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.06);
            --text-p: #fafafa;
            --text-s: #a1a1aa;
            --radius-md: 20px;
            --radius-lg: 28px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-p);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Top Bar --- */
        .top-bar {
            height: 70px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            flex-shrink: 0;
        }

        .nav-trigger {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--card-glass);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-p);
        }

        .page-title {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(45deg, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* --- Sidebar --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100%;
            background: var(--bg-elevated);
            z-index: 3000;
            transform: translateX(-100%);
            transition: transform 0.3s var(--ease);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        .sidebar.open { transform: translateX(0); }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            z-index: 2500;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .sidebar-overlay.show { opacity: 1; visibility: visible; }

        .side-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .side-brand-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        .side-nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .nav-item {
            padding: 16px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-s);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--card-glass);
            color: var(--text-p);
        }

        .nav-item.active {
            border: 1px solid var(--border);
            color: var(--accent);
        }

        /* --- Content --- */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 25px 20px 100px;
            -webkit-overflow-scrolling: touch;
        }

        .view-panel {
            display: none;
            animation: fadeIn 0.4s var(--ease);
        }

        .view-panel.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-card-stack {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .info-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .info-card-l { display: flex; flex-direction: column; gap: 4px; }
        .info-card-lbl { font-size: 0.75rem; color: var(--text-s); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .info-card-val { font-size: 1.6rem; font-weight: 800; color: var(--text-p); }
        .info-card-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: var(--card-glass);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .section-header {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-s);
            margin: 25px 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .list-item {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            padding: 18px 20px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            transition: transform 0.2s;
        }

        .list-item:active { transform: scale(0.98); }

        .item-info h4 { font-size: 1rem; margin-bottom: 4px; font-weight: 700; }
        .item-info p { font-size: 0.8rem; color: var(--text-s); }

        .profit-badge {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.9rem;
        }

        .btn-action {
            width: 100%;
            background: var(--accent);
            color: white;
            padding: 18px;
            border-radius: 16px;
            border: none;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px var(--accent-glow);
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-action:active { transform: scale(0.97); }

        input {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 15px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus { border-color: var(--accent); }

        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body class="dark-mode">
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <div class="top-bar">
        <div class="nav-trigger" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars-staggered"></i>
        </div>
        <div class="page-title">DASHBOARD</div>
        <div class="user-avatar">A</div>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="side-brand">
            <div class="side-brand-dot"></div>
            <div style="font-weight: 800; font-size: 1.2rem;">Arbitrage Pro</div>
        </div>
        <div class="side-nav">
            <div class="nav-item active" onclick="switchView('home', this)">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </div>
            <div class="nav-item" onclick="switchView('channels', this)">
                <i class="fa-solid fa-tower-broadcast"></i>
                <span>Channels</span>
            </div>
            <div class="nav-item" onclick="switchView('settings', this)">
                <i class="fa-solid fa-gears"></i>
                <span>Settings</span>
            </div>
        </div>
    </div>

    <main class="main-content">
        <!-- Home View -->
        <div id="view-home" class="view-panel active">
            <div class="info-card-stack">
                <div class="info-card">
                    <div class="info-card-l">
                        <span class="info-card-lbl">Monitored Channels</span>
                        <span class="info-card-val" id="count-channels">0</span>
                    </div>
                    <div class="info-card-icon"><i class="fa-solid fa-satellite"></i></div>
                </div>
                <div class="info-card">
                    <div class="info-card-l">
                        <span class="info-card-lbl">Opportunities Found</span>
                        <span class="info-card-val" id="count-opportunities">0</span>
                    </div>
                    <div class="info-card-icon"><i class="fa-solid fa-bolt"></i></div>
                </div>
            </div>

            <div class="section-header">Recent Live Updates</div>
            <div id="opportunities-list">
                <!-- Data here -->
            </div>
        </div>

        <!-- Channels View -->
        <div id="view-channels" class="view-panel">
            <div class="section-header">Source Management</div>
            <div style="margin-bottom: 25px;">
                <p style="color: var(--text-s); font-size: 0.85rem; margin-bottom: 15px;">Add channel usernames you want to monitor automatically.</p>
                <input type="text" id="channel-input" placeholder="@username">
                <button class="btn-action" onclick="addChannel()">+ Add Monitoring Channel</button>
            </div>
            <div class="section-header">Channel List</div>
            <div id="channels-list"></div>
        </div>

        <!-- Settings View -->
        <div id="view-settings" class="view-panel">
            <div class="section-header">Engine Settings</div>
            <div style="background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 20px; padding: 25px;">
                <label style="display: block; font-size: 0.8rem; color: var(--text-s); margin-bottom: 10px;">Minimum Profit Threshold ($)</label>
                <input type="number" id="min-profit-input" step="0.01">
                <p style="font-size: 0.7rem; color: var(--text-s); margin-top: 10px;">The bot will ignore any deals with a profit lower than this value.</p>
                <button class="btn-action" onclick="saveSettings()">Update Settings</button>
            </div>
        </div>
    </main>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#111113';
        tg.backgroundColor = '#1a1a1c';

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('show');
            tg.HapticFeedback.impactOccurred('light');
        }

        function switchView(id, el) {
            document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            
            toggleSidebar();
            tg.HapticFeedback.selectionChanged();
        }

        async function loadData() {
            try {
                const res = await fetch('/api/dashboard/data');
                const data = await res.json();
                
                document.getElementById('count-channels').innerText = data.channels.length;
                document.getElementById('count-opportunities').innerText = data.opportunities.length;
                document.getElementById('min-profit-input').value = data.min_profit;

                // Render Channels
                const cList = document.getElementById('channels-list');
                cList.innerHTML = data.channels.map(c => `
                    <div class="list-item">
                        <div class="item-info">
                            <h4>${c.username}</h4>
                            <p>Status: Live Monitoring</p>
                        </div>
                        <div onclick="deleteChannel('${c.username}')" style="color: #ef4444; font-size: 1.2rem; cursor: pointer;">
                            <i class="fa-solid fa-circle-xmark"></i>
                        </div>
                    </div>
                `).join('') || '<p style="text-align: center; color: var(--text-s);">No channels yet</p>';

                // Render Opps
                const oList = document.getElementById('opportunities-list');
                oList.innerHTML = data.opportunities.map(o => `
                    <div class="list-item">
                        <div class="item-info">
                            <h4>🌍 ${o.country}</h4>
                            <p>${o.channel}</p>
                        </div>
                        <div class="profit-badge">+$${o.profit}</div>
                    </div>
                `).join('') || '<p style="text-align: center; color: var(--text-s);">Waiting for opportunities...</p>';

            } catch (e) {
                console.error(e);
            } finally {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
            }
        }

        async function addChannel() {
            const user = document.getElementById('channel-input').value;
            if(!user) return;
            const res = await fetch('/api/dashboard/channels', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user})
            });
            if(res.ok) {
                document.getElementById('channel-input').value = '';
                loadData();
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        async function deleteChannel(user) {
            const res = await fetch(`/api/dashboard/channels/${user}`, {method: 'DELETE'});
            if(res.ok) {
                loadData();
                tg.HapticFeedback.notificationOccurred('warning');
            }
        }

        async function saveSettings() {
            const min = document.getElementById('min-profit-input').value;
            const res = await fetch('/api/dashboard/settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({min_profit: min})
            });
            if(res.ok) {
                tg.showAlert("Settings Saved");
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
