<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arbitrage Dashboard | لوحة التحكم</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(20, 20, 20, 0.7);
            --gold: #d4af37;
            --gold-bright: #ffdf00;
            --gold-gradient: linear-gradient(45deg, #8a6d3b, #d4af37, #f7ef8a, #d4af37, #8a6d3b);
            --text-color: #ffffff;
            --text-dim: #b0b0b0;
            --border-color: rgba(212, 175, 55, 0.2);
            --accent-glow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(212, 175, 55, 0.1);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 10px;
        }

        .header-logo {
            font-size: 2.2rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: var(--accent-glow);
        }

        .header-subtitle {
            color: var(--text-dim);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .stat-card:active { transform: scale(0.95); }

        .stat-card i {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 5px 0;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.75rem;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gold);
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .item-info p {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
        }

        .btn-icon.delete { color: #ff4d4d; }
        .btn-icon.delete:hover { background: rgba(255, 77, 77, 0.1); }

        .navbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 450px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            display: flex;
            justify-content: space-around;
            padding: 12px 10px;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.7rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-item.active { color: var(--gold); }
        .nav-item i { font-size: 1.3rem; margin-bottom: 4px; }

        .btn-primary {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: var(--accent-glow);
            transition: transform 0.2s;
        }

        .btn-primary:active { transform: scale(0.97); }

        .content-section {
            display: none;
            animation: slideUp 0.4s ease-out;
        }

        .content-section.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            outline: none;
            font-size: 1rem;
        }

        input:focus { border-color: var(--gold); }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--gold);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            box-shadow: var(--accent-glow);
        }

        .profit-badge {
            background: rgba(0, 255, 100, 0.1);
            color: #00ff64;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <header>
            <h1 class="header-logo">ARBITRAGE PRO</h1>
            <p class="header-subtitle">Advanced Monitoring System</p>
        </header>

        <!-- Home Section -->
        <div id="section-home" class="content-section active">
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fa-solid fa-satellite-dish"></i>
                    <div class="stat-value" id="count-channels">0</div>
                    <div class="stat-label">القنوات المتابعة</div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-bolt"></i>
                    <div class="stat-value" id="count-opportunities">0</div>
                    <div class="stat-label">فرص الربح المكتشفة</div>
                </div>
            </div>

            <div class="section-title">آخر الفرص المكتشفة</div>
            <div id="opportunities-list" class="item-list">
                <!-- Data will be loaded here -->
                <div style="text-align: center; color: var(--text-dim); padding: 20px;">جاري تحميل البيانات...</div>
            </div>
        </div>

        <!-- Channels Section -->
        <div id="section-channels" class="content-section">
            <div class="section-title">إدارة القنوات</div>
            <button class="btn-primary" onclick="showAddChannelModal()" style="margin-bottom: 20px;">
                <i class="fa-solid fa-plus"></i> إضافة قناة جديدة
            </button>
            <div id="channels-list" class="item-list">
                <!-- Channels will be listed here -->
            </div>
        </div>

        <!-- Settings Section -->
        <div id="section-settings" class="content-section">
            <div class="section-title">إعدادات النظام</div>
            <div class="card">
                <div class="input-group">
                    <label>الحد الأدنى للربح ($)</label>
                    <input type="number" id="min-profit-input" step="0.01" value="0.05">
                </div>
                <button class="btn-primary" onclick="saveSettings()">حفظ الإعدادات</button>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <i class="fa-solid fa-chart-line"></i>
            <span>الرئيسية</span>
        </div>
        <div class="nav-item" onclick="switchTab('channels', this)">
            <i class="fa-solid fa-tower-broadcast"></i>
            <span>القنوات</span>
        </div>
        <div class="nav-item" onclick="switchTab('settings', this)">
            <i class="fa-solid fa-gears"></i>
            <span>الإعدادات</span>
        </div>
    </nav>

    <!-- Modal Add Channel -->
    <div id="modal-add-channel" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--gold); margin-bottom: 15px;">إضافة قناة جديدة</h3>
            <div class="input-group">
                <label>معرف القناة (Username)</label>
                <input type="text" id="channel-username" placeholder="@ChannelName">
            </div>
            <button class="btn-primary" onclick="addChannel()">تأكيد الإضافة</button>
            <button class="btn-primary" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-dim); margin-top: 10px;" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#050505';
        tg.backgroundColor = '#050505';

        // Fake Data for UI testing, will be replaced by API
        let data = {
            channels: [],
            opportunities: [],
            min_profit: 0.05
        };

        function switchTab(id, el) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + id).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            
            tg.HapticFeedback.selectionChanged();
        }

        function showAddChannelModal() {
            document.getElementById('modal-add-channel').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-add-channel').style.display = 'none';
        }

        async function loadData() {
            try {
                const res = await fetch('/api/dashboard/data');
                data = await res.json();
                renderUI();
            } catch (e) {
                console.error("Failed to load data", e);
            } finally {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
            }
        }

        function renderUI() {
            document.getElementById('count-channels').innerText = data.channels.length;
            document.getElementById('count-opportunities').innerText = data.opportunities.length;
            document.getElementById('min-profit-input').value = data.min_profit;

            // Render Channels
            const cList = document.getElementById('channels-list');
            cList.innerHTML = data.channels.map(c => `
                <div class="list-item">
                    <div class="item-info">
                        <h4>${c.username}</h4>
                        <p>النمط: ${c.pattern}</p>
                    </div>
                    <div class="item-actions">
                        <button class="btn-icon delete" onclick="deleteChannel('${c.username}')">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('') || '<p style="text-align: center; color: var(--text-dim);">لا توجد قنوات بعد</p>';

            // Render Opportunities
            const oList = document.getElementById('opportunities-list');
            oList.innerHTML = data.opportunities.map(o => `
                <div class="list-item">
                    <div class="item-info">
                        <h4>🌍 ${o.country}</h4>
                        <p>شراء: ${o.buy}$ | بيع: ${o.sell}$</p>
                    </div>
                    <div class="profit-badge">+$${o.profit}</div>
                </div>
            `).join('') || '<p style="text-align: center; color: var(--text-dim);">لا توجد فرص مكتشفة حالياً</p>';
        }

        async function addChannel() {
            const user = document.getElementById('channel-username').value;
            if(!user) return tg.showAlert("يرجى إدخال المعرف");
            
            const res = await fetch('/api/dashboard/channels', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user})
            });
            if(res.ok) {
                closeModal();
                loadData();
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        async function deleteChannel(user) {
            if(!confirm(`هل أنت متأكد من حذف ${user}؟`)) return;
            const res = await fetch(`/api/dashboard/channels/${user}`, {method: 'DELETE'});
            if(res.ok) {
                loadData();
                tg.HapticFeedback.notificationOccurred('warning');
            }
        }

        async function saveSettings() {
            const min = document.getElementById('min-profit-input').value;
            const res = await fetch('/api/dashboard/settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({min_profit: min})
            });
            if(res.ok) {
                tg.showAlert("تم حفظ الإعدادات بنجاح");
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
